# 腕 CL2（スクリプト方策）の倍数の仮の既定（設計書 docs/design/task_api.md の付記「CL2: スクリプト方策」）。読むのは
# src/recovla/api/skills_script_self.CL2Rules.from_config。閾値・余白は、推定した大きさ・向き・不確かさ（σ）からの相対で書き、
# 場面の寸法（立方体の一辺・箱の寸法・置き場所・固定の高さ・待機位置）を使わない。手元の開発の試行で決め直す。
cl2:
  hold_frac: 0.5          # 持っている: 開き幅の読み ≥ 狙いの物の推定の短い幅 × これ（min_grip_gap_m の代わり）
  open_frac: 1.1          # 開いた（完了の判定）: 開き幅の読み ≥ 推定の短い幅 × これ
  lift_frac: 0.25         # 持ち上がった: 閉じた所から、物の見かけの高さ × これ 以上上がった
  above_frac: 0.25        # 真上: 指先と物の水平の差 ≤ 物の短い幅 × これ ＋ unc_k × σ
  grasp_tol_frac: 0.1     # 閉じてよい: 同じく ≤ 物の短い幅 × これ ＋ grasp_unc_k × σ
  grasp_unc_k: 1.0
  far_k: 2.0              # 持っていない: 写っている物が指先から 物の半径 × これ ＋ unc_k × σ より遠い
  airborne_frac: 0.25     # 宙にある: 物の中心 − （机 ＋ 見かけの高さ × 0.5）≥ 見かけの高さ × これ ＋ unc_k × σ
  clear_frac: 0.25        # 放す高さ・通る高さの余裕: 持っている物の見かけの高さ × これ
  slot_frac: 0.375        # 置き場所の埋まり: 箱の中の物が 推定の内寸の半分の短い方 × これ 以内
  unc_k: 2.0              # 余白に掛ける不確かさの倍数（物・箱の推定）
  map_cell_k: 2.0         # 高さの地図の升の幅: 点の間隔（まばらな方のカメラ）× これ
  map_unc_k: 3.0          # 通る高さの余白: 地図の σ（深度の雑音の目安）× これ
  map_self_k: 2.0         # 地図から外す自分の点: そのフレームのロボットの部品の箱を 升の幅 × これ 太らせた内側（画像の自己除去から漏れた縁）
  map_below_k: 3.0        # 地図に入れない低い点: 机の平面より 地図の σ × これ 低い（机の外の床）
  map_edge_k: 5.0         # 地図に入れない深度の段差の縁（空飛ぶ画素）: 観測の深度の 3×3 の差 ≥ 地図の σ × これ
  grasp_eps_frac: 0.125   # ハンドの grasp に渡す許す幅: 推定の短い幅 × これ ＋ unc_k × σ
  startup_wait_s: 3.0     # 起動: 箱らしい物と色の物が見えるまで待つ上限 [s]（見えなければ止める）
  home_wait_s: 10.0       # 全部の手順の後、始めの姿勢へ戻るのを待つ上限 [s]（試行全体の 200 s の中）
  est_speed_window_s: 1.0 # 推定の速さを測る窓 [s]（スクリプト CL と同じ）
  still_window_s: 0.1     # 手先の速さを測る窓 [s]（同じ）
  finger_moved_m: 0.002   # 閉じる指令の後に指が動いたとみなす開き幅の変化 [m]（ハンドの読みの性質。物の大きさではない）
