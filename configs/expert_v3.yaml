# 段階 3 の 1 周目（案 1）: エキスパートの終盤の近づきを遅くして、指令と手先の差（先行）を小さくする。
# 目標書 v2 の設定（config.load_v2）の上に重ねる生成の設定（rig_kind "v3"）。実行系と評価は使わない。
# speed_ref・gain_per_s は全体では変えない（搬送も遅くなり、30 s の制限に当たるため）。値は回す前に固めた。
expert:
  final_approach:
    radius_m: 0.12      # x_des から水平の狙い（把持点）まで、この距離以内なら水平の速さの上限を xy にする
    xy: 0.07            # [m/s]（speed_scale を掛ける）。0.08 では試しの先行 20.6 mm で関門（≤ 20 mm）に届かず、0.07 に下げた
    blend_m: 0.06       # radius_m から radius_m + blend_m までは、上限を基準の速さから直線でつなぐ（速さを跳ばさない）
    z_band_m: 0.05      # 把持の高さからこの高さ以内なら、z の速さの上限を z にする（近づく・下りる・閉じる段だけ）
    z: 0.045            # [m/s]（speed_scale を掛ける）
    z_blend_m: 0.03     # z_band_m から z_band_m + z_blend_m までは直線でつなぐ
