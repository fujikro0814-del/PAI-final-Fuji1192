# 実機に合わせる重ねの設定の案（real_v1）。sensor_v1 などの v2 の層の上に重ねて読む: config.load(*V2_LAYERS, "expert_v3", "real_v1")
# まだどの評価・生成にも入れていない（作者の判断の後に使う）。値の出どころはすべて実機 2026-10-11 の試験
# （C:\PAI\real_panda\panda_tests.md の A3・A5・A6。Panda＋Franka Hand、libfranka 0.9.2、System 4.2.2、PREEMPT_RT）。
# 範囲で測った値は、モデルに入れる 1 つの値と、測った範囲（*_range）を並べる。

sensor:
  # 実機 2026-10-11 A3: 読める頻度 15.3 Hz（間隔は最大 102 ms）、指を開いたまま 60 秒の幅の雑音（標準偏差）0.00014 mm、
  # 幅の刻み（最小の変化）0.00066 mm。sensor_v1 の 10 Hz・0.1 mm・0.1 mm は実機より厳しい仮定だった。
  # ただし B1・A6（2026-10-11）で、指が動いている間に新しい値が届く間隔は 中央値 0.14〜0.18 s（10〜90%: 0.137〜0.20 s）。
  # 15.3 Hz の読みは同じ値を 2〜3 回返している。センサのモデル（値を保つ頻度）には、新しい値の頻度 6.5 Hz を使う
  gripper: {rate_hz: 6.5, read_rate_hz: 15.3, width_sigma: 1.4e-7, width_unit: 6.6e-7}

real_v1:
  source: "実機 2026-10-11 A3/A5/A6/B1（panda_tests.md・panda_testsv3.md）"
  gripper:
    # 実機 2026-10-11 B1（閉じ 35 回・開き 35 回）・A3・A6: 新しい値が届いた時刻（同じ値の読みを除く）を、動いている間
    # （閉じ 77〜46 mm、開き 45〜74 mm）で直線に当てはめ、元の幅まで戻した時刻＝「届く幅」が動き始める時刻:
    # 閉じ 中央値 0.23 s（10〜90%: 0.15〜0.26）、開き 0.23 s（0.16〜0.29）、A3 空振り 0.20 s、A6 0.22 s。
    # 届く値は、新しい値の間隔（約 0.15 s）の半分ほど古いので、指そのものが動き始めるのは約 0.08 s 早い ≒ 0.15 s。
    # ばらつき（SD 0.04）は、値の届く間隔の位相（一様に 0〜0.15 s）だけで説明できる大きさなので、指の遅延は一定にし、
    # ばらつきはセンサのモデル（上の rate_hz 6.5）で出す。センサのモデルを重ねずに使うときは dead_time_s を 0.23 にする
    dead_time_s: 0.15
    dead_time_sd: 0.0
    reported_onset_s_range: [0.13, 0.30]
    # 実機 2026-10-11 B1: 動いている間の速さ（新しい値の直線の傾き）閉じ 中央値 0.0795 m/s、開き 0.080 m/s、A3 空振り 0.080 m/s
    # ＝ 指令 0.08 のまま（speed_scale 1）。A3 から出した「実効 0.05 m/s」の上限（speed_cap）は、動き始めの遅延と最後の詰めを
    # 含んだ平均だったので切る（0）。補間で出した 0.077 m/s・0.27 s は、同じ値の読みが続く階段の影響で偏っていた
    speed_scale: 1.0
    speed_cap: 0.0
    # 実機 2026-10-11 B1（28 組）・A6（5 組）: 開くときの最後の詰め（目標まで 9〜0.8 mm）を指数で当てはめた減速の強さ
    # 中央値 9.1 /s（25〜75%: 8.9〜9.2）。hand.py は 20 /s。空振りの落ち着き（届く幅）1.46〜1.49 s も
    # 0.15 + (79.8 − 8.8)/0.08 + ln(8.8/0.5)/9.1 + 約 0.08（届く遅延）≒ 1.43〜1.5 s で合う
    k_pos: 9.1
    move_4cm_s_range: [1.04, 1.16]
    # 実機 2026-10-11 B1: 幅が落ち着く（最後の値から 0.2 mm 以内）まで、指令から 平行・斜め 0.67〜0.91 s（中央値 0.84）、
    # 角と角 1.27〜1.43 s、空振り 1.46〜1.49 s。grasp の呼び出しが返るまで 平行 1.36〜1.62 s、角と角 1.10〜1.24 s（偽）、空振り 1.60〜1.62 s（偽）
    grasp_settle_s_range: {parallel: [0.67, 0.91], corner: [1.27, 1.43], miss: [1.46, 1.49]}
    grasp_return_s_range: {parallel: [1.36, 1.62], corner: [1.10, 1.24], miss: [1.58, 1.63]}
    # 実機 2026-10-11 B1: 掴んだ後（指令が返って 2 s 後）の幅の分け方。48 回すべてがどれかに入り、25〜39・42.5〜52 mm で落ち着いた回は 0。
    # 平行 39.40〜40.29、斜め 41.0〜42.2（保つ間に平行へ寄り、最大 1.5 mm 狭まる）、角と角 53.76〜56.32（対角線 56.6、is_grasped 偽・
    # grasp は偽を返すが力はかけ続け、64 s まで幅は変わらない）、空振り 0.51〜0.52（A3 0.23〜0.59）
    width_classes_m: {miss: [0.0, 0.025], parallel: [0.025, 0.0405], slanted: [0.0405, 0.0425], gap: [0.0425, 0.052],
                      corner: [0.052, 0.058], open: [0.058, 0.081]}
    # 実機 2026-10-11 A3: 空振り（幅 0.04・0.08 m/s・40 N・±5 mm）は指令から 0.92〜1.01 s で 2.5 cm を切り、
    # 最後の幅 0.23〜0.59 mm、grasp の呼び出しは 1.58〜1.63 s で返る、is_grasped は偽
    empty_grasp_below_25mm_s_range: [0.92, 1.01]
    empty_grasp_final_width_m_range: [0.00023, 0.00059]
    empty_grasp_return_s_range: [1.58, 1.63]
    # 実機 2026-10-11 A6: 発火と同時に 40 → 79 mm へ開く（0.08 m/s）のに 0.90〜1.04 s
    open_40_to_79mm_s_range: [0.90, 1.04]
    # 実機 2026-10-11 A3: 掴む指令の 0.2 s 後の stop は 3 回中 1 回効かなかった（指が動き始める前）。反射は stop を使わない
    stop_before_motion_unreliable: true
    # 動かせる場所: harness/hand_real.py の RealTiming（dead_time_s・dead_time_sd・dead_time_s_range・speed_scale・k_pos・speed_cap）。
    # harness/hand.py は変えない。シミュレーションとの比べ: scripts/real/check_grasp_b1.py
  arm:
    # 実機 2026-10-11 A5: 手先の段差 ±2 cm の遅延 3〜8 ms、行き過ぎ 最大 0.11 mm。運ぶ動きの最大のずれ 0.65（50%）・0.97 mm（100%）、
    # 時間の遅延 8・6 ms（CartesianPose、ロボットの内部の逆運動学）。静止の揺れ 0.003 mm 以下
    tracking_lag_s_range: [0.003, 0.008]
    tracking_max_err_m: 0.001
    # 実機 2026-10-11 A5: 手先の加速度の上限 1.0 m/s²（2 cm を 0.18 m/s で動かす 2.7 m/s² は、ホームで関節 2 の加速度の限界を
    # 超えて cartesian_motion_generator_joint_velocity_discontinuity で止まった。直交座標の指令の口のときの値）
    ee_accel_cap_mps2: 1.0
    # 実機 2026-10-11 A6: 止まるのは経路に沿って減速度 1.0 m/s²（最短 0.2 s）、0.09〜0.20 m/s から 0.19〜0.40 s・9.3〜26.2 mm。
    # 再開は 0.5 m/s²（最短 0.3 s）、関節の加速度は限界の 32% 以下でエラーなし
    stop_decel_mps2: 1.0
    stop_min_s: 0.2
    resume_accel_mps2: 0.5
    resume_min_s: 0.3
    # 実機 2026-10-11 A2: communication_test_hold（10 s）で落ちた通信 0.16%、成功率 平均 0.98・最小 0.94（CPU を performance に）。
    # powersave では 0.32%・平均 0.94（警告が出る）。実験の前に毎回 performance にする
    comm_loss_ratio: 0.0016
    success_rate_min: 0.94
  arm_servo:
    # 腕の関節の位置のサーボを実機の追従に合わせる（harness/arm_real.py の ArmServo。harness/world.py は変えない）。
    # 実機 2026-10-11 A8（スクリプトの再生 38 本、libfranka の濾波 100 Hz）: 関節は指令に 一次遅延 6 ms（通常の速さ）・7〜8 ms（遅い版）で
    # 付いていき、遅延を除いたずれは RMS 0.15〜0.25 mrad、静止のずれ ±0.2 mrad。既定のシミュレーションは 96〜98 ms 遅延（kv/kp = 0.1 s）、
    # 重力の分のずれ（関節 2 が 3〜6 mrad、関節 4 が −4〜−5 mrad。sensor_v1 の gravity_compensation は MuJoCo の ngravcomp = 0 で
    # 効いていなかった）。scripts/real/fit_servo.py で通常の速さ 6 本に合わせ（63 組の格子＋9 組の詰め）、残りの 32 本（通常 13・
    # 遅い版 19）で確かめた: 関節のずれの RMS 5〜19 → 0.17〜0.28 mrad、手先の差 中央値 4.4〜9.7 → 0.14〜0.24 mm・最大 ≤ 1.2 mm、
    # 遅延の差 ≤ 2 ms（outputs/real/fit_servo/heldout.json）。
    # kp は以前に自作した遠隔操作と記録の道具の 2 倍、kv は以前に自作した遠隔操作と記録の道具のまま、指令の速さの先送り 1.0（減速が速さのずれに掛かる＝実機の関節インピーダンスと同じ形）、
    # 遅延 4 ステップ = 8 ms（libfranka の濾波と通信 約 3 ms ＋ 実機の内部の追従 約 3〜5 ms をまとめたもの）、重力の補償あり。
    # 近い値（kp 1.5〜3 倍・kv/kp 0.03〜0.05・先送り 0.95〜1.0・遅延 3〜4 ステップ）は同じくらい合う（RMS 0.222〜0.230 mrad）。
    # kp を以前に自作した遠隔操作と記録の道具の 5 倍より大きくすると、物理の 1 ステップ 2 ms で発散した
    kp: [9000.0, 9000.0, 7000.0, 7000.0, 4000.0, 4000.0, 4000.0]
    kv: [450.0, 450.0, 350.0, 350.0, 200.0, 200.0, 200.0]
    vel_ff: 1.0
    cmd_delay_steps: 4
    gravity_comp: true
  workspace:
    # 実機 2026-10-11: 台座の座標 = Rz(−130°)・シミュレーションの座標（関節では q1 から 130° 引くだけ）。q1 の範囲は壁を測るまで仮
    q1_shift_rad: -2.2689280275926285
    q1_range_rad: [-2.80, -1.66]
