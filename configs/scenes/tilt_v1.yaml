# 斜めの場面の振り v1（設計書 docs/design/task_api.md 5-1）。v3_real の世界は変えず、試行の始めに箱（静止の体）の向き・傾きを
# シードから一様に引いて置き直す（scripts/api/measure_geometry.py --scene）。いちばん低い底の角を机に付ける。測定だけに使う
# （成功の体積・完了の判定の真値は向きを考えないので、この場面の成功の数は使わない）。
name: tilt_v1
box:
  yaw_deg: [0.0, 90.0]      # 向き（正方形の箱は 90° ごとに同じ）
  roll_deg: [-8.0, 8.0]     # 箱の x 軸まわりの傾き
  pitch_deg: [-8.0, 8.0]    # 箱の y 軸まわりの傾き