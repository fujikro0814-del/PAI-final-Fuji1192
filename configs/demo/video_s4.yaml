# 提出用の動画の場面の並びと長さ。scripts/video_scenes.py が読む。
# コンセプト（作者の決定 2026-10-19）: 「失敗してもやり直して作業を続けるロボット」。システムとして見せる。2 段構え＝VLA による動作のやり直し（第 1 段、掴み損ね）と
# LLM による手順の組み直し（第 2 段、落とした・止まった）を、1 つの回復の仕組みとして評価した（立方体の本番 CLC）。数字は仕組み全体の比べ。
# 第 1 段は仕組みの紹介だけで、単独の数字は出さない（差が確かでない。説明資料に正確に書く）。独自の呼び名は使わず、具体的な言葉で書く。
# 映像はすべて実機で測った値を反映した世界（v3_real）。実機の値を反映したことは前提（説明資料の工夫した点、動画は札 1 枚）。
# clip は outputs/demo_v4/<場面>/trial_NN.mp4（scripts/api/demo_ladder.py で、元の判定済みの記録と同じ設定で回し直したもの）。
# 回し直しは元の記録と同じ経過になるとは限らない（GPU の推論の揺れ）。作者の決定（2026-10-19「それで行こう」）で、「同じ設定で回し直した
# 試行の映像」と画面に明記し、映したい動きが起きた回し直しを選ぶ。数字は判定済みの記録から。expect_*: 回し直しの経過が場面の説明と
# 合うか（check が確かめる）。
# 時刻（t0・t1・events の t）は映像の時刻 s。倍速は (t1 − t0) / dur_s で 2 倍まで。segments を書いた場面は部分ごとの倍速。
values:
  clc_n: 200                      # 立方体の本番（CLC・CLC_B、手順書 docs/api/cl2_cube_protocol.md）
  clc_n0: 71                      # 回復なし（復帰デモなしで学習した VLA、組み直しなし）
  clc_l2v2: 143                   # 回復の仕組み全体（復帰デモありで学習した VLA ＋ 見張り役と LLM の組み直し）。H-SYS b 12・c 84、Holm p 1.8e-14
  clc_cl2: 198                    # 学習した方策を使わないシーケンス制御（点群で物の位置を推定し、掴む・運ぶ・置くを決めた順序と条件で進める。
                                  # 腕を動かす下の層は VLA と共通）。H-CL2 b 2・c 57、Holm p 1.2e-14
                                  # 止まった試行の数（なし 136・あり 40）は動画に出さない（作者の指示 2026-10-20: 文脈が分かりにくい。説明資料に書く）
  cup_n: 200                      # カップを皿に（CPL・CPL_B、docs/api/cup_plate_protocol.md）
  cup_rreal: 15                   # 立方体の手本だけで学んだ VLA
  cup_rcp: 125                    # カップの手本で学習し直した VLA。H-Rcp b 5・c 115、Holm p 9.0e-28
  nr_n0_k: 10                     # 本番の把持失敗から方策が自分で立て直した数（事後の集計、scripts/api/natural_recovery.py、
  nr_n0_n: 112                    # outputs/api/natural_recovery_CLC.json）。回復なし（成功デモのみ）N0 と、回復デモも学習 U0（再計画なし）
  nr_u0_k: 50
  nr_u0_n: 112
scenes:
  - id: title                     # コンセプトと 2 段構え
    dur_s: 6
  - id: system                    # 主な成果の場面: 同じ配置（CLC_B 171318）で、回復の仕組みあり（左）・なし（右）。元の記録: あり 23.3 s に赤を落として
                                  # 組み直し、125.7 s に 3 個とも。なし 64.8 s に止まった（箱は空）。回し直し: あり s318_L2v2_c（緑を 40.8 s に持ち上げ
                                  # 42.1 s に落とす、43.5 s に検知、45.3 s に「もう一度緑、そのあと青」、84.9 s に 3 個目）、なし s318_N0_a（64.8 s に止まった、箱は空）。
                                  # 落とす色・時刻は元の記録と違う（回し直しの揺れ）。8 本の回し直しから、落下 → 組み直し → 3 個ともが起きたものを選んだ
    clip_with: s318_L2v2_c/trial_00.mp4
    clip_without: s318_N0_a/trial_00.mp4
    expect_with: {success: true, dropped: true, replan: true}
    expect_without: {success: false, stopped: true}
    crop: [40, 600, 120, 1116]
    headline: 落下を検知 → LLM が状況を報告して再計画し、タスクを完了
    labels: [回復あり（回復デモ＋再計画）, 回復なし（成功デモのみ）]
    segments:
      - {t0: 0.0, t1: 37.0, speed: 2.0}
      - {t0: 37.0, t1: 50.0, speed: 1.0}
      - {t0: 50.0, t1: 88.0, speed: 2.0}
    dur_s: 50.5
    report_s: 14.0
    events_with:
      - {t0: 42.0, t1: 45.3, text: 搬送中に落下, kind: ng}
      - {t0: 59.3, t1: 84.9, text: "再計画: 緑を再試行 → 青", kind: ok}
      - {t0: 84.9, t1: 99.0, text: 3 個とも収納, kind: ok}
    count: true
    plan_until: 30.0              # 映像の時刻 30 s まで、指示と LLM の最初の計画を映像の下に出す（左右とも 赤 → 緑 → 青）
    cover_t: 86.0                # 題と終わりの静止画（3 個とも入った後）
    events_without:               # 回復なしは、同じ手順を 2 回（30 s ずつ）試して終わらなければ中止する（記録の stopped）
      - {t0: 32.9, t1: 64.8, text: 赤でタイムアウト → 1 回だけ再試行, kind: ng}
      - {t0: 64.8, t1: 99.0, text: 2 回タイムアウト → 停止, kind: ng}
  - id: instr                     # 指示を変えた実演（作者の指示 2026-10-20 の M5）。主な場面と同じ配置 171318・回復あり（L2v2）で、指示だけ変えた
                                  # 回し直し 3 本（評価とは別）。それぞれ最後に箱に入る所の 16 s を 2 倍速で
    dur_s: 8.0
    headline: 指示を変えると、LLM の計画が変わる（同じ配置）
    crop: [40, 600, 120, 1116]
    panels:
      - {clip: s318_txt_blue/trial_00.mp4, text: 青だけ片付けて, plan: "計画: 青", t0: 19.0, t1: 35.0}
      - {clip: s318_txt_notred/trial_00.mp4, text: 赤以外を片付けて,
         plan: "計画: 緑 → 青。緑を落とし、先に青へ組み直した", t0: 47.0, t1: 63.0}
      - {clip: s318_txt_greenlast/trial_00.mp4, text: 緑は最後にして、全部片付けて, plan: "計画: 赤 → 青 → 緑", t0: 60.0, t1: 76.0}
  - id: contrast                  # 第 1 段: VLA による動作のやり直し。同じ配置で左右に並べる。意図的に失敗させていない試行。実時間。数字なし
    dur_s: 15                     # 掴み直すまでは実時間、箱へ運ぶ所は 2 倍速（指示を変えた実演の時間を空けるため、2026-10-20）
    segments:
      - {t0: 4.0, t1: 15.0, speed: 1.0}
      - {t0: 15.0, t1: 23.0, speed: 2.0}
    clip_with: c1_R_t2/trial_02.mp4   # 復帰デモありで学習したモデル、意図的な失敗なし 163018 の青（回し直し: 6〜7 s に掴み損ね → 11〜14 s に掴み直し → 22.0 s に収納）
    clip_without: c1_N/trial_02.mp4   # 復帰デモなし、同じ配置（7 s ごろ掴み損ね、空の手で箱へ、60 s で失敗）
    expect_with: {success: true}
    expect_without: {success: false}
    t0: 4.0
    t1: 23.0
    headline: 把持失敗 → VLA がその場で再把持
    labels: [回復デモも学習, 成功デモのみで学習]   # 「第 1 段」は独自の用語なので画面に出さない（作者の指示 2026-10-20）
    footnote: true
    done_with: 22.0
    events_with:
      - {t0: 6.5, t1: 9.5, text: 把持失敗, kind: ng}
      - {t0: 9.5, t1: 15.0, text: その場で再把持, kind: ok}
      - {t0: 15.0, t1: 22.0, text: 箱へ搬送, kind: ok}
    events_without:
      - {t0: 6.5, t1: 9.5, text: 把持失敗, kind: ng}
      - {t0: 9.5, t1: 99.0, text: 再把持せず、空の手で箱へ, kind: ng}
  - id: diagram                   # 詳しいブロック線図を部分ごとに拡大して字幕で説明（作者の指示 2026-10-20）。前の「ループの図」（12 s）と
                                  # 「回復デモの作り方」（10 s）の場面を置き換える（回復デモの作り方は F の部分で説明）
    dur_s: 38.75
    move_s: 0.75
    keys:
      - {part: all, hold: 3.0, caption: [回復の仕組みの全体（ブロック線図）, 信号は左から右へ。帰還は下を通って左へ戻る]}
      - {part: A, hold: 5.5, caption: ["A タスク層: LLM が指示を色の列に分解し、実行器が 1 つずつ VLA へ渡す",
                                        落下・2 回目のタイムアウトで、別の LLM が状況を報告して計画を修正]}
      - {part: B, hold: 5.0, caption: ["B 方策層: VLA が画像 2 枚と状態から、50 ステップ分の行動を出す（10 Hz）",
                                        推論中も前の行動を実行し続ける。把持失敗はここで再把持（回復デモで学習）]}
      - {part: CD, hold: 5.0, caption: ["C・D: 手先の変位を逆運動学で関節の指令にし、Panda を動かす",
                                         ▲ はサーボ・グリッパ・指の幅のセンサなど、実機で測った値を反映（Real2Sim）]}
      - {part: E, hold: 5.0, caption: ["E 知覚・判定: 画像と深度から物体を推定し、状態・完了・落下を判定する",
                                        観測は VLA へ、完了と落下は下の帰還線で A の実行器と再計画へ返す]}
      - {part: F1, hold: 4.0, caption: ["F 学習（オフライン）: エキスパートに意図的に失敗させ、回復デモを自動生成",
                                         把持失敗は把持点か閉じる高さをずらし、置き損ねは机の上で放す。確定以降を記録]}
      - {part: F2, hold: 4.0, caption: [成功デモ 240 本＋回復デモ 90 本で SmolVLA を追加学習（人手の遠隔操作なし）,
                                         学習した重み θ は、B 方策層の VLA に入る]}
      - {part: all, hold: 2.0, caption: [青い塗りは学習した要素、青い枠は回復のための要素]}
  - id: numbers                   # 主な成果（回復の仕組み全体）の数字
    dur_s: 14
  - id: cl2                       # 点群と規則で動く制御との比べ。回し直し s386_CL2_a（元の記録 CLC_B 171386 の CL2: 成功）
    clip: s386_CL2_a/trial_00.mp4
    expect: {success: true}
    t0: 4.0
    t1: 38.0
    dur_s: 17
  - id: cup                       # 別のタスク「カップを皿に置いて」。回し直し cup082_L2v2_a（元の記録 CPL 171082 の L2v2_Rcp）
    clip: cup082_L2v2_a/trial_00.mp4
    expect: {success: true}
    t0: 0.0
    t1: 24.0
    dur_s: 13
  # real2sim（実機の値を反映した札、6 s）は外した（作者の指示 2026-10-20 の L6。図の場面の C・D の字幕で同じことを言う）
  - id: limits
    dur_s: 8
  - id: qa                        # 締め: 作者の 3 つの問いと答え（作者の指示 2026-10-20 の L1。前の締めの題の画面を置き換える）
    dur_s: 9
