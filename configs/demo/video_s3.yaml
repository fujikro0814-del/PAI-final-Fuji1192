# 段階 3 の動画の場面の並びと長さ（判断の原則 10/07: 動画は簡易な説明、本文に場面を関連づける、記号を使わない）。
# 説明資料（scripts/paper_pdf.py）と動画（scripts/video_common.py）の両方がこの表を読み、本文の「動画 m:ss〜m:ss」はここから計算する。
# clip は outputs/demo_v2/<場面>/trial_NN.mp4（scripts/63_demo_v2.py で回し直し、compare で元の記録と同じ経過のものだけ）
# 10/08 の並べ替え（優秀賞の方針）: 冒頭に左右比較（contrast）を置き、題名・課題は短い札に、復帰デモの作り方（recipe）と
# 意図的な失敗の評価の 1 回（contrast_p1）を足した。場面の id は説明資料の {{v_<id>}} と対応する（id を変えると本文の時刻が切れる）。
# 倍速は (t1 − t0) / dur_s。10/07 の指示で 1.0（実時間）や 2.0 のような切りのよい値にする。課題の規則（10/08 の変更）で、
# 倍速は 2 倍まで、動画全体は 1〜3 分（video_common.py が超えたら止める）。
# events_with / events_without の t0・t1 は映像の時刻（s）。kind: ng は失敗（橙）、ok は成功（緑）。
scenes:
  - id: contrast         # 冒頭。同じ配置で左右に並べる（復帰デモあり／なし）。実時間。意図的に失敗させていない試行
    # 10/08 17:30 の作者の判断（文字が多すぎ）: 同時に出す文字は 3 つまで（見出し 1 行・左右の短いラベル・映像の下の一言か数字）と、
    # 角の小さな札（ロボット自身の失敗・実時間）だけ。映像が動いている間は映像を主役にし、数字は左が成功した後に出す。
    # 回し直しの注記は冒頭には出さず、限界の場面と説明資料に書く
    dur_s: 25
    clip_with: nat_140017_R/trial_01.mp4      # 140017 緑。約 10 s で把持に失敗 → 掴み直して 24.7 s に収納（元の記録 27.3 s）。映像は 24.7 s で終わり、その後は最後のフレームを止めて見せる
    clip_without: nat_140017_N/trial_01.mp4   # 約 10 s で把持に失敗し、空のグリッパで箱へ向かったまま回復しない（映像は 30.0 s まで）
    t0: 5.0
    t1: 30.0                                  # 左の成功は動画の 0:19.6。その後の約 5 s に数字を出す
    headline: 自動で作った復帰デモで学ぶと、自分で掴み直す     # 動画全体の 1 文のアイデアの短い形（説明資料の冒頭の文と同じ考え方）
    corner: ロボット自身の失敗                 # 角の札。後ろに「・実時間」（倍速なら「・N 倍速」）を足す
    labels: [復帰デモあり, 復帰デモなし]
    footnote: false                           # 回し直しの注記を出さない（限界の場面に移した）
    band_from: 24.6                           # 数字を出す映像の時刻（左が成功した後、動画の 0:19.6）。数字が出ている間は映像の下の一言を消す
    done_with: 24.6
    events_with:
      - {t0: 9.5, t1: 12.0, text: 掴み損ねた, kind: ng}
      - {t0: 12.0, t1: 20.0, text: 自分で掴み直す, kind: ok}
      - {t0: 20.0, t1: 24.6, text: 箱へ運ぶ, kind: ok}
    events_without:
      - {t0: 9.5, t1: 12.0, text: 掴み損ねた, kind: ng}
      - {t0: 12.0, t1: 99.0, text: 掴み直さない, kind: ng}
  - id: title            # 題名と、実機・人手のデモ集めを使わないこと
    dur_s: 6
  - id: problem          # 課題（成功デモだけでは失敗の後を知らない、難しい点＝学習した方策が動きながら自分で掴み直す、人手で集めるのは手間）
    dur_s: 10            # 10/08: 難しい点の 1 行を足したので 8 → 10 s（全体 150 → 152 s）
  - id: recipe           # 復帰デモの作り方（説明資料の図 2 と同じ図）
    dur_s: 14
  - id: contrast_p1      # 把持を意図的に失敗させた評価の 1 回（テスト用の評価の A_P1・B_P1 の 9 番、両方とも実際に失敗し、ありだけ成功した組）。実時間
    dur_s: 17
    clip_with: p1_141009_R/trial_00.mp4       # 141009 赤。約 8〜10 s に意図的な失敗 → 掴み直して 22.2 s に収納（元の記録 23.2 s）
    clip_without: p1_141009_N/trial_00.mp4    # 失敗の後、空のグリッパで箱へ向かい回復しない
    t0: 6.0
    t1: 23.0
    sub: 閉じる直前に手先を横へずらして、把持を意図的に失敗させる（評価と同じ方法）
    done_with: 22.1
    events_with:
      - {t0: 0.0, t1: 7.5, text: 赤の立方体を掴みにいく}
      - {t0: 7.5, t1: 10.5, text: 手先をずらされて掴み損ねる, kind: ng}
      - {t0: 10.5, t1: 17.5, text: 自分で掴み直す, kind: ok}
      - {t0: 17.5, t1: 22.1, text: 持ち上げて箱へ, kind: ok}
      - {t0: 22.1, t1: 99.0, text: 箱に入れて成功, kind: ok}
    events_without:
      - {t0: 0.0, t1: 7.5, text: 赤の立方体を掴みにいく}
      - {t0: 7.5, t1: 10.5, text: 手先をずらされて掴み損ねる, kind: ng}
      - {t0: 10.5, t1: 99.0, text: 何も持たずに箱へ向かう（掴み直さない）, kind: ng}
  - id: method           # 図 1 の簡略版（センサの出力だけで動く・LLM と VLA の分担）
    dur_s: 12
  - id: task_intro       # 実演の条件（指示・順番の決め方・学習したのは 1 色の動作だけ・1 個あたりの時間とやり直し・20 配置中 6 配置で成功）。10/07 の指示で追加
    dur_s: 10
  - id: task             # 「全部片付けて」→ LLM の分解 → 3 個を収納（2.0 倍速。10/08 の規則の変更で倍速は 2 倍まで。映像は 70.2 s、終わりの 1.8 s は最後のフレームを止めて見せる）
    dur_s: 36
    t0: 0.0
    t1: 72.0
    clip: task_145003/trial_00.mp4      # 145003（10/07 の指示で途中に掴み直しのある場面へ替えた）。緑を 27.1・34.1 s に掴み損ね（空のまま持ち上げ）、40.5 s に掴んで箱へ。70.3 s（元の記録 E7 run_0003: 28.7・30.5 s に掴み損ね、35.4 s に掴んで 47.2 s に収納、71.7 s）
    # 緑は箱に入った後、完了の確認が 30 秒に間に合わず待機位置へ戻り、戻ってから 1.2 s で確認された（元の記録も同じ）
    # 以前の選択: 145016（掴み直しなし、60.9 s）。145007 は回し直しで止まり、145019 は掴み直しの有無が違うので使わない
    events:                             # 右の欄に出す注記（映像の時刻 s）。数は書かない（10/08: 手書きの数字にしない）。
      # 「その場で」は、方策が待機位置に戻らずに自分で掴み直したこと（上位層の実行器の「待機位置に戻ってやり直す」とは別）を表す
      - {t0: 27.0, t1: 40.5, text: "掴み損ね → その場で掴み直す"}
      - {t0: 40.5, t1: 48.5, text: "掴み直して箱へ"}
  - id: numbers          # 主な数字 3 つ
    dur_s: 12
  - id: limits           # 限界と今後（2 点）
    dur_s: 10
# 図 2（説明資料）: contrast と同じ場面から 4 時刻
fig2:
  with: {clip: nat_140017_R/trial_01.mp4}
  without: {clip: nat_140017_N/trial_01.mp4}
  times: [7.0, 10.0, 16.0, 24.0]
