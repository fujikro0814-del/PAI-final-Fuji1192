# 提出用の動画の場面の並び。scripts/video_final.py が読む。
# 場面ごとに dur_s（秒）、voice（読み上げ: 場面の中の秒 t と文）。映像は outputs/demo_v4 の回し直し（video_scenes.py と同じ部品）と、
# 別に作った場面の mp4・静止画（成功率の階段・実機）。
# 番外編の数は scripts/api/judge_success_relearn.py check-r の判定の記録（outputs/api、同じ 200 通りの初期状態）から。
title: 失敗からの立て直しを学ぶロボット
scenes:
  - id: open                      # 冒頭: 掴み損ね → その場で掴み直して箱へ（1 本を大きく）
    kind: single
    clip: c1_R_t2/trial_02.mp4    # 6〜7 s に掴み損ね → 11〜14 s に掴み直し → 22.0 s に箱へ
    crop: [40, 600, 120, 1116]
    segments:
      - {t0: 5.5, t1: 15.0, speed: 1.0}
      - {t0: 15.0, t1: 22.6, speed: 2.0}
    dur_s: 13.3
    label: 学習した VLA（立て直しの学習データも学んだもの）
    done: 22.0
    events:
      - {t0: 6.5, t1: 9.5, text: 掴み損ねた, kind: ng}
      - {t0: 9.5, t1: 15.0, text: その場で掴み直す, kind: ok}
      - {t0: 15.0, t1: 22.0, text: 箱へ運ぶ, kind: ok}
      - {t0: 22.0, t1: 99.0, text: 箱に入った, kind: ok}
    voice:
      - {t: 0.3, text: 家で片付けるロボットは、掴み損ねるたびに、人を呼ぶわけにはいかないのだ。}
      - {t: 6.7, text: このロボットは、自分の失敗から、立て直し方を学ぶのだ。}
  - id: ladder                    # 成功率の階段（棒が順に伸びる 6.9 s ＋ 最後のフレームを止める）
    kind: movie
    path: C:/PAI/提出物/成功率の階段/成功率の階段.mp4
    dur_s: 12.8
    voice:                        # 学び方の効果（72%）と、学習とは別に重ねた仕組み（96.5%）を分けて言う
      - {t: 0.5, text: 学び方だけで、成功率は39パーセントから72パーセントに、}
      - {t: 6.6, text: 手順の組み直しなどを重ねて、96.5パーセントになったのだ。}
  - id: recipe                    # 立て直しの学習データの作り方
    kind: recipe_v5
    dur_s: 9.3
    voice:
      - {t: 0.3, text: まず、学習データを作るプログラムに、わざと失敗させて、そこから立て直す様子を学習データに足したのだ。}
  - id: r1                        # 自分の失敗から学び直す
    kind: r1
    dur_s: 15.2
    voice:
      - {t: 0.3, text: 次に、学習したVLAを実際に動かして、失敗した直後からプログラムに立て直させ、その経過で学び直したのだ。}
      - {t: 9.85, text: 自分の失敗から学ぶので、本番で起きやすい失敗に強くなるのだ。}
  - id: llm                       # LLM が手順を組み直す（左右の比較）
    kind: compare
    clip_with: s318_L2v2_c/trial_00.mp4
    clip_without: s318_N0_a/trial_00.mp4
    crop: [40, 600, 120, 1116]
    headline: "＋LLM が手順を組み直す: 運ぶ途中で落としたとき"
    labels: [組み直しあり, 組み直しなし]
    segments:                     # 場面の中の時刻: 落とす 9.0 s、報告 12.8 s、右が止まる 24.4 s、左の 3 個目 34.45 s
      - {t0: 24.0, t1: 41.0, speed: 2.0}
      - {t0: 41.0, t1: 49.0, speed: 1.0}
      - {t0: 49.0, t1: 88.0, speed: 2.0}
    dur_s: 36.0
    report_s: 14.0
    count: true
    plan_until: 30.0
    events_with:
      - {t0: 42.0, t1: 45.3, text: 運ぶ途中で落とした, kind: ng}
      - {t0: 59.3, t1: 84.9, text: "組み直し: 緑をもう一度 → 青", kind: ok}
      - {t0: 84.9, t1: 99.0, text: 3 個とも箱へ, kind: ok}
    events_without:
      - {t0: 32.9, t1: 64.8, text: 赤で時間切れ → もう 1 回だけ試す, kind: ng}
      - {t0: 64.8, t1: 99.0, text: 2 回時間切れ → 止まる, kind: ng}
    voice:
      - {t: 0.3, text: 指示「全部片付けて」を、LLMが、赤、緑、青の順に分けるのだ。}
      - {t: 8.9, text: あっ、運ぶ途中で緑を落としたのだ。}
      - {t: 12.8, text: LLMが状況を報告して、緑をもう一度運び、次に青を運ぶ、と手順を組み直したのだ。}
      - {t: 24.4, text: 組み直しのない右のロボットは、2回時間切れになって、止まってしまったのだ。}
      - {t: 32.9, text: 左は、3個とも箱に入ったのだ。}
  - id: place                     # 配置位置による目標条件付け
    kind: place
    dur_s: 12.3
    reveal_s: 6.3
    voice:
      - {t: 0.3, text: それでも残った失敗の多くは、箱の中の物の上に置いてしまうものだったのだ。}
      - {t: 6.3, text: そこで、箱の空いている場所を配置位置としてVLAに与え、学び直したのだ。}
  - id: diagram                   # 仕組みの全体（ブロック線図を部分ごとに。部分の範囲は report_figs の DETAIL_PARTS）
    kind: diagram
    dur_s: 38.6
    move_s: 1.0                   # 次の部分へ移る時間。1 部分 1 文、読み終えてから移る
    keys:                         # 時刻: all 0〜10、A 11〜17.9、B 18.9〜25.9、E 26.9〜33、F 34〜38.6
      - {part: all, hold: 10.0, caption: [仕組みの全体, LLM が手順を決め、VLA が腕を動かし、判定が完了と落下を返す]}
      - {part: A, hold: 6.9, caption: ["LLM が指示を色の順に分け、1 つずつ VLA へ渡す", 落とした・2 回時間切れのときは、別の LLM が状況を報告して手順を組み直す]}
      - {part: B, hold: 7.0, caption: ["VLA（SmolVLA）が画像 2 枚と腕の状態、配置位置から、次の動きを出す（10 Hz）", 掴み損ねからの掴み直しも、ここで学んだ動き]}
      - {part: E, hold: 6.1, caption: [画像と深度から物の位置を推定し、完了・落下を判定する, 落下は、指の幅の変化を画像で確かめて判定]}
      - {part: F, hold: 4.6, caption: ["学習はオフライン: 成功 240＋立て直し 90＋追加 340 ＝ 670 本", "配置位置も VLA に入力して学び直す（約 4 時間 45 分）"]}
    voice:
      - {t: 0.3, text: 全体では、LLMが手順を決めて、VLAが腕を動かし、カメラの判定が完了や落下を知らせるのだ。}
      - {t: 11.3, text: LLMは、指示を色の順に分けて、落としたときは手順を組み直すのだ。}
      - {t: 19.2, text: VLAは、カメラの画像2枚と腕の状態から、次の動きを出すのだ。}
      - {t: 27.2, text: カメラの判定は、物の位置と、完了や落下を見分けるのだ。}
      - {t: 34.3, text: 学習データは、すべてシミュレーションで自動で作ったのだ。}
  - id: real                      # 実機で測ったシミュレーション（実機とシミュレーションを左右に）
    kind: movie
    path: C:/PAI/提出物/H1_実機/場面_掴んでから放す_2倍速.mp4
    speed: 2.0                    # 映像は 2 倍速で作ってある（画面の右上に表示）。概要欄の倍速の一覧が読む
    dur_s: 6.3
    voice:
      - {t: 0.3, text: シミュレーションは、実機のPandaで測った腕とハンドの応答に合わせてあるのだ。}
  - id: rtc_numbers               # 【番外編】RTC を足した結果の数の 1 画面（詳しくは説明資料の付録 A）
    kind: numbers
    dur_s: 13.3
    headline: "【番外編】動きを滑らかにする RTC を足すと"
    rows:
      - {name: RTC なし（最終モデル）, value: 193, total: 200, shown: "96.5%", kind: plain}
      - {name: ＋RTC（原典の設定）, value: 158, total: 200, shown: "79.0%", kind: ng}
    lines: [つなぎ目は滑らかになったが、掴み損ねが増え、成功率は下がった]
    foot: 3 個とも箱に入った割合（同じ 200 通りの初期状態）。寄せる範囲を変えた 3 つの設定と原因の分析は、説明資料の付録 A
    voice:
      - {t: 0.3, text: 番外編として、動きを滑らかにするRTCを足してみたら、重要な知見が得られたのだ。}
      - {t: 8.3, text: 詳しくは、説明資料にまとめたのだ。}
  - id: recap                     # 結果のまとめ（冒頭の階段の図をもう一度）
    kind: image
    path: C:/PAI/提出物/成功率の階段/成功率の階段.png
    dur_s: 15.0
    voice:
      - {t: 0.3, text: まとめると、立て直しの学習データと学び直し、手順の組み直し、配置位置を重ねて、}
      - {t: 7.77, text: 成功率は、39パーセントから96.5パーセントまで上がったのだ。}
  - id: limits                    # 今後の課題で締める（VOICEVOX の表記もここに）
    kind: limits
    dur_s: 7.8
    voice:
      - {t: 0.3, text: 今後の課題は、実機での評価と、手首の向きを変える動きなのだ。}
