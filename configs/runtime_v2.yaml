# 目標書 v2 の実行系の手段の値（知覚・安全フィルタの余裕・知覚の遅延・知覚の失敗の止まり方）。sensor_v1 に重ねて読む
# （config.load("sensor_v1", "runtime_v2")）。どの値も学習用のシード（59000〜）だけで決めた（5、 の 4・5）。
# 決め方と測った値は docs/results/perception_thresholds_v1.json・perception_accuracy_v1.json。
runtime_v2:
  perception:
    # 自己除去の太らせ方と、テーブル面からの閾値（5。scripts/83_perception_check.py thresholds、59100〜59109）。
    # 回す前の決まり（ロボットの点が残る割合 ≤ 0.5% の最小）では 3 cm になり、手首の立方体の点の 81% を消して検出が 28% に落ちた。
    # 知覚は色で立方体を拾うので、残った灰色・黒のロボットの点は立方体にならない。そこで知覚の出力（検出 − 取り違え、
    # 俯瞰と手首の悪い方）が最もよい組にした（ で報告）
    self_margin_m: 0.0
    table_h: 0.015
    sigma_overhead: 0.008
    sigma_wrist: 0.002
  # 安全フィルタの余裕: 机上の立方体の中心の位置の誤差（3 次元）の p95（accuracy、59200〜59219）
  safety_extra_margin_m: 0.0274      # 20 本・更新 3096 回で、中央値 13.9 mm・p95 27.4 mm
  # 知覚の遅延（-2）: update の計算時間の p99 を 10 ms 単位で切り上げた値
  perception_latency_s: 0.12         # 計算時間の中央値 0.106 s・p99 0.114 s
  # 知覚の計算の遅延（io.compute の種類ごと）。4 種類とも同じ決まり（作者の決定 2026-10-19「3 種類とも同じ決まりで置く」）:
  # max(0.16 s, 計算時間の p99) を 10 ms 単位で切り上げ。2026-10-19 14:09〜14:41 に A 機で、立方体の本番と同じ 4 条件
  # （N0・U0・L2v2・CL2）を 4 本並行（本番と同じかやや重い負荷、ほかの仕事なし）で、シード 193954〜193957 を 4 本ずつ回し、
  # 種類ごとに全試行をまとめて測った（実験 CLCLAT、docs/results/clclat_latency.json）。
  # ここの "perception" は上の perception_latency_s より優先する。生成（handover_v2）は perception_latency_s のまま。
  compute_latency_s:
    # 旧い知覚（Perception.update。U0・N0）: 3086 回、中央値 0.183 s・p90 0.199 s・p99 0.214 s・最大 0.231 s
    perception: 0.22
    # 推定の版の知覚（GeometryPerception = 旧い知覚 ＋ EstimatedGeometryFinder。L2v2・CL の --finder estimated）:
    # 708 回、中央値 0.316 s・p90 0.448 s・p99 0.620 s・最大 1.288 s
    perception_est: 0.62
    # CL2 の知覚（推定の版 ＋ 高さの地図。io.compute の中の全部）: 267 回、中央値 0.323 s・p90 0.446 s・p99 0.612 s・最大 0.654 s
    perception_cl2: 0.62
    # 起動時の 1 回（check_table・init_box）: 16 回、中央値 0.525 s・p99 0.573 s・最大 0.574 s
    perception_startup: 0.58
  checks:                       # 知覚の失敗の止まり方（-4）
    box_frames: 5               # 起動時に箱を当てはめるフレームの数
    # 起動時のテーブル面のずれ・箱の既知の位置からのずれは、学習用のシード（30 本・20 本）で見た最大の 2 倍にした。 の 4-4 の
    # 初期値（5 mm・1°、2 cm・3°）では、較正誤差のモデル（俯瞰の回転 0.5°）のもとで箱のずれが 20 本中 5 本で 2 cm を超え、試行を始めなくなる
    table_dz_m: 0.047           # 見た最大 23.4 mm
    table_angle_deg: 2.49       # 見た最大 1.24°
    box_dev_m: 0.061            # 見た最大 30.3 mm
    box_dev_deg: 1.9            # 見た最大 0.95°
    target_missing_s: 1.0       # サブタスクの始めから目標の色が見つからない時間
  # グリッパの指令のためらいの幅と最短の保持時間（ の B3）。方策の出力の 7 番目が close 超で閉、open 未満で開、
  # 切り替えてから min_hold_s の間は切り替えない。採るかは  の ■ 3 の決まり（検証用のシードで確かめる）
  # 参照位置の綱（ の B1）[m]。x_cmd を指令の姿勢の手先からこの距離の中に留める。0 なら留めない。値は学習用のデータの
  # エキスパートの |x_cmd − 手先| の最大（53.5 mm）より大きくし、生成では働かない（学習データが変わらない）ようにする
  xcmd_leash_m: 0.0
  gripper_gate:
    enabled: false
    close: 0.3
    open: -0.3
    min_hold_s: 0.5
  # 完了判定（runtime/judge.py）。画素の閾値は旧版（planner.presence、学習用のシード範囲で決めた値）から始め、
  # v2 のセンサの画像で学習用のシードから決め直す（scripts/85 の fit。決め直すまでは旧版の値）
  judge:
    box_min_pixels: 56
    wrist_min_pixels: 33
    wrist_min_fraction: 0.73
    height_tol_m: 0.01          # 上面が「箱の底＋一辺＋1 cm」以下（別の立方体の上に乗ったものを落とす。）
    gripper_open_m: 0.075       # 測った開き幅（開いた 0.08 から 5 mm の余裕）
    retreat_tol_m: 0.05         # 旧版と同じ（planner.judge）
    still_speed: 0.01           # 旧版と同じ
    hold_s: 1.0                 # 旧版と同じ（planner.completion_hold_s。 の 8: 変えない）
# 段階 2 のデータ生成（エキスパートの側。実行系ではない）の A の意図的な失敗: 発動から確定までの時間切れを 6 → 12 s にする。
# v2 の腕は制限層でずらした点への移動が遅く、学習データのシード 30000 は発動から 6.9 s かかる
inject:
  A:
    timeout_s: 12.0
# 自動で決める値（perception の self_margin_m・table_h・top_band、safety_extra_margin_m、perception_latency_s、checks の
# table_*・box_*）は configs/runtime_v2_derived.yaml（scripts/83_perception_check.py derive）が上書きする。上の値は最初の版の記録
# 回す前に置いた手段の決まりを、学習用のシードの中で直したもの（。README の設計の経緯に載せる）
revised_rules:
  - rule: 自己除去の太らせ方 M
    before: ロボットの点が残る割合 ≤ 0.5% の最小（0107 の 4・0108 の 2 の 4）
    after: 知覚の出力（検出 − 取り違え、俯瞰と手首の悪い方）が最もよい値。条件として、障害物がロボットと 5 mm 以内に来る更新が 1% 以下（0113 の 2）
    why: この知覚は立方体を色で拾うので残ったロボットの点は出力に効かず、前の決まりは M = 3 cm を選んで手首の検出を 27% に落とした（0112）
  - rule: テーブル面からの閾値 H
    before: 机の点が残る割合 ≤ 0.1%、立方体の画素が H 以下で落ちる割合 ≤ 10%（0108 の 2 の 5）
    after: 上と同じく知覚の出力で決める
    why: 縁の空飛ぶ画素で机の割合は 0.13% で止まり、立方体の側面の下の方は H によらず落ちる（0112）
  - rule: 起動時の確かめの閾値（テーブル面・箱のずれ）
    before: 5 mm・1°、2 cm・3°（0107 の 4-4 の初期値）
    after: 学習用のシードで見た最大の 2 倍（0113 の 1 で決まりとして固定）
    why: 較正誤差の模型のもとで、箱のずれが 20 本中 5 本で 2 cm を超え、試行を始めなくなる（0112）
  - rule: 知覚の測り方（精度の決まりの前提）
    before: 高さは信じているテーブル面から測る
    after: 各カメラ自身の深度で当てはめた平面から測り、俯瞰は起動時に外部パラメータの傾きと高さを直す（0112・0113 の 3）
    why: 較正誤差で机が傾いて見え、机の点が大量に残った
  - rule: 色の閾値（min_margin）
    before: 学習時の値 40（きれいな描画で決めた planner.color_detect）。回す前の決め直しの決まりは「見落としと取り違えの画素の合計が最小」
    after: センサの模型の画像で、箱の画素がどの立方体の色にも入らない最小の値（学習用のシード 59100〜59109）= 70（0114）
    why: 露出と白の釣り合いのばらつきで黄色の箱が赤に数えられ、知覚と方策の手がかりに赤の取り違えを作った。画素の合計の決まりは手首の近接の見落としに引っぱられて 55（漏れが残る）を選ぶ
  - rule: 知覚の遅れの測り方
    before: 決まり（計算時間の p99 を 10 ms 単位で切り上げ）だけで、測るときの計算機の負荷を決めていなかった
    after: 最終評価と同じ負荷（3 本同時）で測った値を使う（v3 の測定は 3 本同時で 0.16 s。単独に近い v2 の測定では 0.12 s）
    why: 計算時間は負荷で変わる。控えめな側（評価と同じ負荷）に揃える
  - rule: 推定を足した知覚の遅れ
    before: どの知覚も "perception" の 0.16 s（旧い知覚 Perception.update だけを測った値）
    after: 推定の版は "perception_est"、CL2 は "perception_cl2" に分け、それぞれの計算の時間の p99 から（compute_latency_s、2026-10-19）
    why: 推定と高さの地図も同じ io.compute の中で計算するので、CL2 は 1 回に 0.65 s ほど、推定の版は 0.1 s ほど只で考えていた
  - rule: 旧い知覚と起動時の遅れ
    before: 旧い知覚の更新も起動時の 1 回（机と箱の当てはめ）も "perception" の 0.16 s
    after: どちらも同じ決まり（max(0.16 s, 本番と同じ負荷の p99)、10 ms 単位）。起動時は "perception_startup" に分ける（compute_latency_s、2026-10-19）
    why: CL2 だけ正直にして VLA の側を甘くしないため（作者の決定）。CLCLAT で旧い知覚の p99 0.214 s、起動時 0.573 s
  - rule: 段階 2 の生成の A の注入の時間切れ
    before: 発動から確定の判定まで 6 s（旧版の生成と同じ）
    after: 12 s（v2 の層だけ。旧版の生成は変えない）（0115・0117）
    why: v2 の腕は制限層でずらした点への移動が遅く、発動から 6.9 s かかる例がある。なお 0115 では閉じ切りを開き幅でも判定する回避策も入れたが、原因（ハンドの模型が空を掴むと指の腹どうしを押し合わせて震える）を sensor-v1.1 で直したので外した（0117）
